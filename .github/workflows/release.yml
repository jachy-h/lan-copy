name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read committed version
        id: version
        run: |
          version="$(python3 scripts/ci_release_version.py)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf '## Lan Copy %s\n\nCommit: `%s`\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.os }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Test release scripts and browser logic
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test-service-status.cjs
          node scripts/test-delete-confirmation.cjs
          node scripts/test-dialog.cjs
          node scripts/test-upload-tree.cjs
          node scripts/test-settings-update.cjs

  build:
    name: Build signed packages
    needs: [metadata, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build with existing version and signing key
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          LAN_COPY_SIGNING_KEY: ${{ secrets.LAN_COPY_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.LAN_COPY_UPDATE_PUBLIC_KEY }}
        run: |
          if [ -z "$LAN_COPY_SIGNING_KEY" ]; then
            echo '::error::Configure the LAN_COPY_SIGNING_KEY repository Actions secret.'
            exit 1
          fi
          if [ -z "$UPDATE_PUBLIC_KEY" ]; then
            echo '::error::Configure the LAN_COPY_UPDATE_PUBLIC_KEY repository Actions variable.'
            exit 1
          fi
          make build VERSION="$RELEASE_VERSION"
          LAN_COPY_RELEASE_DIR=release LAN_COPY_RELEASE_VERSION="$RELEASE_VERSION" go test -run '^TestPublishedReleasePackages$' ./internal/httpserver
          git diff --exit-code -- VERSION
          printf '\nSigned Windows amd64 and macOS Apple Silicon packages built for **%s**.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed archives and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lan-copy-${{ needs.metadata.outputs.version }}-${{ github.sha }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lan-copy-${{ needs.metadata.outputs.version }}-${{ github.sha }}
          path: release
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$draft" = false ]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "Lan Copy $RELEASE_VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
