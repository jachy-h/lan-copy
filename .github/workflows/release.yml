name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read committed version
        id: version
        run: |
          version="$(python3 scripts/ci_release_version.py)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf '## Lan Copy %s\n\nCommit: `%s`\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.os }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Test release scripts and browser logic
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Set up frontend Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend toolchain and build
        if: runner.os == 'Linux'
        run: |
          npm install --global npm@11.16.0
          cd frontend
          npm ci
          npm run check-vendor
          npm run check
          npm run check-assets

  browser:
    name: Embedded frontend browser integration
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.16.0
      - working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run check-assets
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser

  build:
    name: Build signed packages
    needs: [metadata, test, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Set up frontend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin frontend npm version
        run: npm install --global npm@11.16.0
      - name: Build with existing version and signing key
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          LAN_COPY_SIGNING_KEY: ${{ secrets.LAN_COPY_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.LAN_COPY_UPDATE_PUBLIC_KEY }}
        run: |
          if [ -z "$LAN_COPY_SIGNING_KEY" ]; then
            echo '::error::Configure the LAN_COPY_SIGNING_KEY repository Actions secret.'
            exit 1
          fi
          if [ -z "$UPDATE_PUBLIC_KEY" ]; then
            echo '::error::Configure the LAN_COPY_UPDATE_PUBLIC_KEY repository Actions variable.'
            exit 1
          fi
          make build VERSION="$RELEASE_VERSION"
          LAN_COPY_RELEASE_DIR=release LAN_COPY_RELEASE_VERSION="$RELEASE_VERSION" go test -run '^TestPublishedReleasePackages$' ./internal/httpserver
          git diff --exit-code -- VERSION
          printf '\nSigned Windows amd64 and macOS Apple Silicon packages built for **%s**.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed archives and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lan-copy-${{ needs.metadata.outputs.version }}-${{ github.sha }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lan-copy-${{ needs.metadata.outputs.version }}-${{ github.sha }}
          path: release
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$draft" = false ]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "Lan Copy $RELEASE_VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, release]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check whether the tap token is configured
        id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo '::warning::Set the HOMEBREW_TAP_TOKEN repository secret ' \
              'to update jachy-h/homebrew-jachy-h automatically.'
            printf 'Homebrew tap not updated: ' >> "$GITHUB_STEP_SUMMARY"
            printf '`HOMEBREW_TAP_TOKEN` is not configured.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.configured == 'true'
        with:
          persist-credentials: false
      - name: Check out the tap repository
        if: steps.tap.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jachy-h/homebrew-jachy-h
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false
      - name: Download release checksums
        if: steps.tap.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir dist
      - name: Point the formula at the new release
        if: steps.tap.outputs.configured == 'true'
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 scripts/update_homebrew_formula.py \
            --formula tap/Formula/lan-copy.rb \
            --checksums dist/SHA256SUMS \
            --version "$RELEASE_VERSION" \
            --asset Lan-Copy-macOS-Apple-Silicon.tar.gz
      - name: Validate the updated formula
        if: steps.tap.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ruby -c tap/Formula/lan-copy.rb
          brew style tap/Formula/lan-copy.rb
          tap_dir="$(brew --repository)/Library/Taps/jachy-h/homebrew-jachy-h"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE/tap" "$tap_dir"
          brew trust --tap jachy-h/jachy-h
          brew audit --strict --online --formula jachy-h/jachy-h/lan-copy
      - name: Commit and push the formula update
        if: steps.tap.outputs.configured == 'true'
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          cd tap
          git add Formula/lan-copy.rb
          if git diff --cached --quiet; then
            echo 'Formula is already current; nothing to push.' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bot="41898282+github-actions[bot]"
          git config user.name "github-actions[bot]"
          git config user.email "$bot@users.noreply.github.com"
          helper='!f() { echo username=x-access-token;'
          helper="$helper echo password=\$GITHUB_TOKEN; }; f"
          git config --local credential.helper "$helper"
          git commit -m "chore: update lan-copy v$RELEASE_VERSION"
          git push
          printf 'Updated `Formula/lan-copy.rb` to **v%s**.\n' \
            "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
