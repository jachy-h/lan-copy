<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>共享空间 · Lan Copy</title>
  <link rel="icon" type="image/svg+xml" href="/logo/favicon-32x32.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/qrcode.js" defer></script>
  <script src="/file-ui.js" defer></script>
  <script src="/access.js" defer></script>
  <script src="/shell.js" defer></script>
  <script src="/settings.js" defer></script>
  <script src="/upload-tree.js" defer></script>
  <script src="/filesystem.js" defer></script>
</head>
<body>
<header class="topbar">
<div class="brand">
      <img class="logo" src="/logo/lan-copy-logo.svg" width="30" height="30" alt="" />
      <div><h1>Lan Copy</h1></div>
    </div>
<nav class="page-nav" aria-label="页面导航">
    <a href="/" aria-current="page">共享空间</a><a href="/transfer.html">文本快传</a>
  </nav>
<div class="hero-actions">
          <div class="share-access" id="shareAccess">
            <button class="share-access-button" id="accessButton" type="button" aria-label="分享" title="分享" aria-haspopup="dialog" aria-expanded="false" aria-controls="accessPanel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4m-6.8 7 6.8 4"/></svg>
            </button>
            <section class="access-card access-popover" id="accessPanel" role="dialog" aria-labelledby="shareAccessTitle" hidden>
              <span class="access-eyebrow" id="shareAccessTitle">分享</span>
              <div class="share-phone">
                <div class="access-copy">
                  <h2 id="accessTitle">手机扫码，立即打开</h2>
                  <p id="accessHint">手机与电脑连接同一局域网后，扫描二维码即可访问</p>
                </div>
                <div class="qr-code loading" id="qrCode" role="img" aria-label="局域网访问二维码"></div>
              </div>
              <div class="access-copy share-computer">
                <h2>分享地址，电脑打开</h2>
                <p>复制下方地址，分享给同一局域网内的电脑，在浏览器中打开。</p>
                <div class="access-address">
                  <span>局域网访问地址</span>
                  <a id="accessAddress" href="#">正在获取局域网地址…</a>
                </div>
                <div class="access-url-row">
                  <select id="accessUrl" aria-label="分享访问地址"><option>正在获取局域网地址…</option></select>
                  <button id="copyAccessUrl" type="button">复制地址</button>
                </div>
              </div>
            </section>
          </div>

          <div class="status-access" id="statusAccess">
            <button class="status" id="serviceStatus" type="button" aria-label="局域网在线" aria-expanded="false" aria-describedby="serviceStatusPopover">
              <span class="status-dot"></span>
              <span class="status-label">局域网在线</span>
            </button>
            <div class="status-popover" id="serviceStatusPopover" role="tooltip" hidden>
              <span class="status-popover-label">数据更新时间</span>
              <time id="dataUpdatedAt">尚未成功更新</time>
              <span class="status-refresh-hint" id="dataRefreshHint">每分钟自动更新</span>
            </div>
          </div>
          <button
            class="shutdown-btn"
            id="shutdownBtn"
            type="button"
            title="关闭 Lan Copy"
            aria-label="关闭 Lan Copy 软件"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v9m5.7-6.7a8 8 0 1 1-11.4 0" />
            </svg>
            <span>关闭软件</span>
          </button>
        </div>

</header>
<main class="shell">
  <section class="files-section explorer" aria-labelledby="explorerTitle">
    <div class="section-head">
      <h2 id="explorerTitle">共享空间</h2>
      <div class="explorer-tools"><input id="search" type="search" placeholder="搜索当前文件夹及子文件夹…" aria-label="搜索当前文件夹及子文件夹" /><input id="folderUploadInput" type="file" webkitdirectory multiple hidden /><button class="secondary" id="uploadFolder" type="button">上传文件夹</button><button class="primary" id="mkdir" type="button">＋ 新建文件夹</button></div>
    </div>
    <div class="explorer-location"><nav id="breadcrumbs" class="breadcrumbs" aria-label="文件夹路径"></nav><span id="entrySummary" aria-live="polite">正在读取…</span></div>
    <div id="entries" class="file-list" aria-live="polite"></div>
    <div class="empty hidden" id="directoryEmpty"><div>▱</div><strong id="emptyTitle">这个文件夹还是空的</strong><p>新建文件夹，或将其他位置的文件移动到这里</p></div>
    <div class="space-upload hidden" id="spaceUpload" aria-live="polite"><span id="spaceUploadLabel"></span><progress id="spaceUploadProgress" max="100" value="0" aria-label="上传进度"></progress></div>
    <div class="upload-drop-message" aria-hidden="true">松开文件或文件夹，上传到当前文件夹</div>
    <p class="explorer-hint">拖入文件或文件夹上传到当前文件夹 · 拖动已共享内容到文件夹即可移动</p>
  </section>
  <footer>文件仅保存在运行 Lan Copy 的电脑上 · 同一局域网内设备可访问</footer>
</main>
<dialog id="editDialog" class="fs-dialog">
  <form id="editForm">
    <h2 id="editTitle">新建文件夹</h2>
    <label for="entryName">名称</label><input id="entryName" required maxlength="200" autocomplete="off" />
    <p id="editError" class="dialog-error" role="alert"></p>
    <div class="dialog-actions"><button class="secondary" type="button" data-close="editDialog">取消</button><button class="primary" type="submit">保存</button></div>
  </form>
</dialog>
<dialog id="moveDialog" class="fs-dialog">
  <h2>移动到文件夹</h2><p id="moveSource" class="file-meta"></p>
  <nav id="moveBreadcrumbs" class="breadcrumbs" aria-label="目标文件夹路径"></nav>
  <div id="moveFolders" class="move-folders"></div>
  <p id="moveError" class="dialog-error" role="alert"></p>
  <div class="dialog-actions"><button class="secondary" type="button" data-close="moveDialog">取消</button><button class="primary" id="confirmMove" type="button">移动到这里</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
