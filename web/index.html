<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <title>Lan Copy · 局域网快传</title>
    <link rel="icon" type="image/svg+xml" href="/logo/favicon-32x32.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#3977f6;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#2362df;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#14213d;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#1a2b4a;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#14213d" flood-opacity="0.3"/>
                </filter>
              </defs>
              
              <!-- 背景圆角矩形 -->
              <rect x="10" y="10" width="100" height="100" rx="20" ry="20" fill="url(#grad2)" filter="url(#shadow)"/>
              
              <!-- 左侧设备图标 -->
              <g transform="translate(25, 35)">
                <!-- 设备主体 -->
                <rect x="0" y="0" width="25" height="35" rx="3" ry="3" fill="#ffffff" opacity="0.9"/>
                <!-- 屏幕 -->
                <rect x="2" y="2" width="21" height="20" rx="1" ry="1" fill="#3977f6"/>
                <!-- 摄像头 -->
                <circle cx="12.5" cy="25" r="1.5" fill="#3977f6" opacity="0.7"/>
                <!-- 底座 -->
                <path d="M5 35 L20 35 L22 38 L3 38 Z" fill="#ffffff" opacity="0.8"/>
              </g>
              
              <!-- 右侧设备图标 -->
              <g transform="translate(70, 40)">
                <!-- 手机主体 -->
                <rect x="0" y="0" width="20" height="35" rx="3" ry="3" fill="#ffffff" opacity="0.9"/>
                <!-- 屏幕 -->
                <rect x="2" y="2" width="16" height="28" rx="1" ry="1" fill="#3977f6"/>
                <!-- 听筒 -->
                <rect x="6" y="3" width="8" height="1" rx="0.5" ry="0.5" fill="#ffffff" opacity="0.7"/>
                <!-- 摄像头 -->
                <circle cx="10" cy="6" r="1" fill="#ffffff" opacity="0.7"/>
                <!-- 主页按钮 -->
                <circle cx="10" cy="33" r="1.5" fill="#3977f6" opacity="0.7"/>
              </g>
              
              <!-- 连接线 -->
              <path d="M50 52 L70 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
              
              <!-- 传输箭头 -->
              <g transform="translate(55, 48)">
                <!-- 向右箭头 -->
                <path d="M0 4 L8 4 L8 0 L14 6 L8 12 L8 8 L0 8 Z" fill="#ffffff" opacity="0.9"/>
              </g>
              
              <!-- 文件图标 -->
              <g transform="translate(48, 65)">
                <path d="M0 0 L12 0 L16 4 L16 16 L0 16 Z" fill="#ffffff" opacity="0.9"/>
                <path d="M12 0 L12 4 L16 4" fill="none" stroke="#2362df" stroke-width="1"/>
                <line x1="3" y1="6" x2="13" y2="6" stroke="#2362df" stroke-width="1" opacity="0.7"/>
                <line x1="3" y1="9" x2="13" y2="9" stroke="#2362df" stroke-width="1" opacity="0.7"/>
                <line x1="3" y1="12" x2="10" y2="12" stroke="#2362df" stroke-width="1" opacity="0.7"/>
              </g>
              
              <!-- 网络节点装饰 -->
              <circle cx="30" cy="25" r="2" fill="#ffffff" opacity="0.4"/>
              <circle cx="90" cy="30" r="2" fill="#ffffff" opacity="0.4"/>
              <circle cx="60" cy="90" r="2" fill="#ffffff" opacity="0.4"/>
            </svg>
          </div>
          <div>
            <h1>Lan Copy</h1>
            <p>同一网络，文件与文字即刻抵达</p>
          </div>
        </div>
        <div class="hero-actions">
          <div class="status" id="serviceStatus">
            <span class="status-dot"></span>
            <span class="status-label">局域网在线</span>
          </div>
          <button
            class="shutdown-btn"
            id="shutdownBtn"
            type="button"
            title="关闭 Lan Copy"
            aria-label="关闭 Lan Copy 软件"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v9m5.7-6.7a8 8 0 1 1-11.4 0" />
            </svg>
            <span>关闭软件</span>
          </button>
        </div>
      </header>

      <section class="access-card" aria-labelledby="accessTitle">
        <div class="access-copy">
          <span class="access-eyebrow">移动设备快捷访问</span>
          <h2 id="accessTitle">手机扫码，立即打开</h2>
          <p>手机与电脑连接同一局域网后，扫描二维码即可访问</p>
          <div class="access-address">
            <span>局域网访问地址</span>
            <a id="accessAddress" href="#">正在获取局域网地址…</a>
          </div>
          <div class="access-url-row">
            <select id="accessUrl" aria-label="二维码访问地址">
              <option>正在获取局域网地址…</option>
            </select>
            <button id="copyAccessUrl" type="button">复制地址</button>
          </div>
        </div>
        <div
          class="qr-code loading"
          id="qrCode"
          role="img"
          aria-label="局域网访问二维码"
        ></div>
      </section>

      <nav class="share-tabs" aria-label="选择共享类型">
        <button
          class="active"
          type="button"
          data-mode="file"
          aria-pressed="true"
        >
          发送文件
        </button>
        <button type="button" data-mode="text" aria-pressed="false">
          共享文本
        </button>
      </nav>

      <section class="upload-card" id="dropZone">
        <input id="fileInput" type="file" multiple hidden />
        <div class="upload-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"
            />
          </svg>
        </div>
        <h2>把文件拖到这里</h2>
        <p>或点击选择文件，可一次传送多个</p>
        <button class="primary" id="chooseBtn" type="button">选择文件</button>
      </section>

      <section class="text-card hidden" id="textPanel">
        <div class="text-compose-head">
          <div class="text-icon" aria-hidden="true">Aa</div>
          <div>
            <h2>共享一段文本</h2>
            <p>链接、验证码、命令或临时笔记</p>
          </div>
        </div>
        <textarea
          id="textInput"
          rows="7"
          placeholder="在这里粘贴或输入文字…"
          aria-label="要共享的文本"
        ></textarea>
        <div class="text-compose-foot">
          <span id="textCount">0 B / 64 KiB</span>
          <button class="primary" id="shareTextBtn" type="button">
            发布文本
          </button>
        </div>
      </section>

      <section class="queue hidden" id="queue" aria-live="polite">
        <div class="queue-head">
          <strong id="queueTitle">正在传送</strong
          ><span id="queuePercent">0%</span>
        </div>
        <div class="progress"><span id="progressBar"></span></div>
        <p id="queueDetail"></p>
      </section>

      <section class="files-section text-section">
        <div class="section-head">
          <div>
            <h2>共享文本</h2>
            <p id="textSummary">正在读取…</p>
          </div>
        </div>
        <div class="text-list" id="textList"></div>
        <div class="empty hidden" id="textEmptyState">
          <div>“ ”</div>
          <strong>还没有共享文本</strong>
          <p>发布后，局域网内的设备可以一键复制</p>
        </div>
      </section>

      <section class="files-section">
        <div class="section-head">
          <div>
            <h2>共享文件</h2>
            <p id="summary">正在读取…</p>
          </div>
          <button
            class="icon-btn"
            id="refreshBtn"
            type="button"
            title="刷新"
            aria-label="刷新共享内容"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M20 11a8.1 8.1 0 0 0-15.5-3M4 4v4h4m-4 5a8.1 8.1 0 0 0 15.5 3M20 20v-4h-4"
              />
            </svg>
          </button>
        </div>
        <div class="file-list" id="fileList"></div>
        <div class="empty hidden" id="emptyState">
          <div>◎</div>
          <strong>还没有文件</strong>
          <p>从任意一台设备上传后，就会出现在这里</p>
        </div>
      </section>

      <footer>
        文件仅保存在运行 Lan Copy 的电脑上 · 同一局域网内设备可访问
      </footer>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="/qrcode.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
